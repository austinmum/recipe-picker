[package]
name = "recipe-picker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_html_form = "0.4.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.2"
tower-http = { version = "0.7.1", features = ["fs"] }
uuid = { version = "1.29.3", features = ["v4"] }
zip = "9.8.2"

[dev-dependencies]
tempfile = "3.27.0"
